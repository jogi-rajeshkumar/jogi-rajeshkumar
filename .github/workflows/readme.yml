name: 🔄 Auto-Generate README

on:
  schedule:
    - cron: "0 6 * * *"  # Every day at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-update
  cancel-in-progress: true

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Needed for rebase

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: ⚙️ Run README generator
        run: python generate_readme.py

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🧠 Pull latest and check changes
        run: |
          # Always pull latest to avoid rejected push
          git pull --rebase origin main || exit 1

          # Only commit if README.md has changed
          if git diff --quiet README.md; then
            echo "✅ No changes in README.md – skipping commit."
            exit 0
          fi

          git add README.md
          git commit -m "📝 Auto-update README from script"

      - name: 🚀 Push updated README safely
        run: git push --force-with-lease origin HEAD:main
