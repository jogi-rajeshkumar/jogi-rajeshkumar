name: 🔄 Auto-Generate README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-autogen
  cancel-in-progress: false

jobs:
  # ── Job 1: Generate stat SVGs via lowlighter/metrics (self-contained, no external APIs) ──
  generate-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: 📊 GitHub Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: jogi-rajeshkumar
          filename: assets/stats/github-stats.svg
          base: header, activity, community, repositories
          config_timezone: Europe/London
          config_output: svg
          config_padding: 0, 8
          plugin_lines: yes

      - name: 🌐 Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: jogi-rajeshkumar
          filename: assets/stats/top-langs.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          config_timezone: Europe/London
          config_output: svg

      - name: 🏆 Achievements / Trophies Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: jogi-rajeshkumar
          filename: assets/stats/achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 10
          config_timezone: Europe/London
          config_output: svg

  # ── Job 2: Generate README and commit everything ──────────────────────────
  build-readme:
    runs-on: ubuntu-latest
    needs: generate-metrics
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 🧠 Generate README
        run: python generate_readme.py

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Commit & Push
        run: |
          set -e
          git add README.md assets/

          if git diff --cached --quiet; then
            echo "✅ No changes – skipping commit."
            exit 0
          fi

          git commit -m "📝 Auto-update README and stat images"

          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "🔁 Push attempt $attempt..."
            git pull --rebase --autostash origin main || true
            if git push --force-with-lease origin HEAD:main; then
              echo "✅ Pushed on attempt $attempt"
              exit 0
            fi
            attempt=$((attempt+1))
            sleep 3
          done
          echo "❌ Failed after $max_attempts attempts."
          exit 1
