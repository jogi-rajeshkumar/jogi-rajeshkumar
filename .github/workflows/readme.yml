name: 🔄 Auto-Generate README

on:
  schedule:
    - cron: "0 6 * * *"  # Run every day at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-autogen
  cancel-in-progress: false

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Required for pulling full history

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 🧠 Run README Generator
        run: python generate_readme.py

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Commit & Push README (Safe Rebase + Retry)
        run: |
          set -e

          # Check if README changed
          if git diff --quiet README.md; then
            echo "✅ No changes to README.md – skipping commit."
            exit 0
          fi

          git add README.md
          git commit -m "📝 Auto-update README from script"

          max_attempts=5
          attempt=1
          success=0

          while [ $attempt -le $max_attempts ]; do
            echo "🔁 Attempt $attempt to push..."

            # Rebase on latest main
            git pull --rebase --autostash origin main || true

            # Safe push
            if git push --force-with-lease origin HEAD:main; then
              echo "✅ Push succeeded on attempt $attempt"
              success=1
              break
            fi

            echo "⚠️ Push failed, retrying..."
            attempt=$((attempt+1))
            sleep 3
          done

          if [ $success -ne 1 ]; then
            echo "❌ Failed to push after $max_attempts attempts."
            exit 1
          fi
